name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Force Mesa software rendering — GitHub Actions runners have no GPU.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL dependencies for headless mockup rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri \
            libglapi-mesa \
            libosmesa6 \
            libglew-dev \
            libglu1-mesa-dev \
            libxi-dev \
            mesa-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run build
      - name: Trick GitHub Pages SPA routing
        run: |
          cp dist/index.html dist/404.html
          # Because Google does not employ humans for anything that isn't remotely fun, they will interpret GitHub's 404 as an actual 404
          # This makes those two URLs Google Play specifically complains about accessible without 404 (200 instead)
          cp dist/index.html dist/datenschutz.html
          cp dist/index.html dist/daten-loeschen.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
